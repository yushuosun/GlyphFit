[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swocr-inputs"
version = "0.1.1"
description = "Source-aware rendering and measured glyph input selection for TeleOCR"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
vision = ["numpy==2.2.6", "opencv-python-headless==4.14.0.94", "Pillow==11.3.0"]

[project.scripts]
swocr = "swocr.cli:main"
glyphfit = "swocr.cli:main"

[tool.setuptools]
packages = ["glyphfit", "swocr"]

